name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits, not tags, so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Compile the helper
        run: python -m py_compile bin/eld-govee

      - name: Unit and end-to-end tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Manifest is valid JSON with the expected entry points
        run: |
          python - <<'PY'
          import json, os
          m = json.load(open("manifest.json"))
          assert m["schemaVersion"] == 1, "schemaVersion"
          assert not m["id"].startswith("omarchy."), "reserved namespace"
          for path in m["entryPoints"].values():
              assert os.path.isfile(path), f"missing entry point {path}"
          print(m["id"], m["version"], "ok")
          PY

      - name: Shell scripts
        run: |
          bash -n install.sh uninstall.sh
          shellcheck install.sh uninstall.sh
